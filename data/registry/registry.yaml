# Canonical synthetic-scenario registry.
# SINGLE SOURCE OF TRUTH for all synthetic identifiers used across the scenario:
# Foundry IQ docs, Fabric tables, Work IQ artifacts, Web IQ snapshots, and the UI.
# Every generator/template/loader MUST import IDs and names from here, never hand-type them.
#
# Synthetic only. No PHI. Trial IDs use the out-of-range NCT99xxxxxx form so they cannot
# collide with real ClinicalTrials.gov records.

