name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - public-release-prep

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  python:
    name: API, provisioning, data, and IaC
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: services/api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/api/requirements.lock.txt
            tools/requirements.lock.txt
      - name: Install Python dependencies
        run: python -m pip install -r services/api/requirements.lock.txt -r tools/requirements.lock.txt
      - name: Audit Python dependencies
        run: |
          python -m pip_audit -r services/api/requirements.lock.txt
          python -m pip_audit -r tools/requirements.lock.txt
      - name: Validate synthetic data
        run: python tools/validate_consistency.py
      - name: Run API and provisioning tests
        run: python -m pytest services/api/tests agent/provisioning/live -q
      - name: Type-check API
        run: python -m pyright
      - name: Compile Python sources
        run: python -m compileall -q services/api/app agent/provisioning/live
      - name: Compile Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Check patch whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            echo "Initial commit has no prior patch range to check."
          elif git merge-base "${{ github.event.before }}" HEAD > /dev/null 2>&1; then
            git diff --check "${{ github.event.before }}...HEAD"
          else
            echo "Push has no common ancestor with the previous ref; no patch range to check."
          fi

  web:
    name: Web lint, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --audit-level=high
      - name: Lint without warnings
        run: npm run lint -- --max-warnings 0
      - run: npm test
      - run: npm run build
